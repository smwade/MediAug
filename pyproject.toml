[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mediaug"
dynamic = ["version"]
description = "Medical image augmentation tools for histology and cytology slides"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sean Wade", email = "seanwademail@gmail.com" },
]
keywords = ["medical-imaging", "augmentation", "histology", "cytology", "pap-smear"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "Pillow",
    "opencv-python-headless",
    "scikit-image",
    "tqdm",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
viz = [
    "matplotlib",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.scripts]
mediaug = "mediaug.cli.main:cli"

[project.urls]
Homepage = "https://github.com/smwade/MediAug"
Repository = "https://github.com/smwade/MediAug"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaug"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 99
extend-exclude = ["src/mediaug/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
